name: Docker Hub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: VERSION ↔ Tag-Konsistenz
        # Kein Release-/Code-Drift: VERSION in vault-api/main.py muss dem Tag
        # entsprechen (Tag v1.2.3 → VERSION "1.2.3"). Bei Mismatch hart fehlschlagen.
        run: |
          CODE_VERSION=$(python3 -c "import re,sys; m=re.search(r'^VERSION\s*=\s*[\"\x27]([^\"\x27]+)', open('vault-api/main.py').read(), re.M); print(m.group(1) if m else sys.exit('VERSION nicht in vault-api/main.py gefunden'))")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "vault-api/main.py VERSION = ${CODE_VERSION}"
          echo "Tag                       = ${GITHUB_REF_NAME} (→ ${TAG_VERSION})"
          if [ "$CODE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION (${CODE_VERSION}) ≠ Tag (${TAG_VERSION}) — vault-api/main.py vor dem Tag anpassen."
            exit 1
          fi
          echo "✅ VERSION und Tag stimmen überein."

      - name: Build and push (vault-api)
        uses: docker/build-push-action@v6
        with:
          context: ./vault-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            magic3arkus/mykeyvault:${{ steps.meta.outputs.version }}
            magic3arkus/mykeyvault:latest

      - name: Update Docker Hub description
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}' \
            | jq -r '.token')
          curl -s -X PATCH "https://hub.docker.com/v2/repositories/magic3arkus/mykeyvault/" \
            -H "Authorization: JWT $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"full_description\": $(jq -Rs . < README.md)}"
